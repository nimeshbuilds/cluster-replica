name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mirror_only:
        description: Run only the disposable CSI mirror suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make generate
      - name: Verify generated files and module lock
        run: |
          go mod tidy
          git diff --exit-code
      - run: make check

  live-vcluster:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run the actual host and guest lifecycle
        run: make test-e2e
      - name: Retain sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-vcluster-evidence
          path: .cache/e2e/run.*/artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  replica-workflow:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
            installer: helm
          - node: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
            installer: cli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: ./hack/fetch-e2e-tools.sh
      - name: Exercise the complete portable replica workflow
        run: |
          ./hack/fetch-helm.sh
          ./hack/e2e-replication.sh
        env:
          REPLICOVE_KIND_IMAGE: ${{ matrix.node }}
          REPLICOVE_INSTALLER: ${{ matrix.installer }}
      - name: Retain sanitized replica evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: replica-workflow-${{ strategy.job-index }}
          path: .cache/replication-e2e/run.*/artifacts/
          include-hidden-files: true
          retention-days: 7

  helm-existing:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          ./hack/fetch-e2e-tools.sh
          ./hack/fetch-helm.sh
          ./hack/e2e-helm-existing.sh
      - name: Retain sanitized existing-vCluster installation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: helm-existing
          path: .cache/helm-existing-e2e/run.*/artifacts/
          include-hidden-files: true
          retention-days: 7

  workload-replication:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workload: [cert-manager, spark, trino, policy]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: ./hack/fetch-e2e-tools.sh
      - name: Replicate and exercise a real operator or data workload
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: ./hack/e2e-workload.sh "$WORKLOAD"
      - name: Retain sanitized workload evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workload-${{ matrix.workload }}
          path: .cache/workload-e2e/run.*/artifacts/
          include-hidden-files: true
          retention-days: 7

  yaml-workflow:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./hack/fetch-e2e-tools.sh
      - name: Run the public YAML walkthrough without either CLI
        run: ./hack/e2e-yaml.sh
      - name: Retain sanitized YAML evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: yaml-workflow
          path: .cache/yaml-e2e/run.*/artifacts/
          include-hidden-files: true
          retention-days: 7

  workload-mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        initial: [current, previous]
    env:
      REPLICOVE_MIRROR_BASE: ${{ matrix.initial }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          ./hack/fetch-e2e-tools.sh
          ./hack/fetch-helm.sh
          ./hack/e2e-mirror.sh
      - name: Retain sanitized mirror lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workload-mirror-evidence-${{ matrix.initial }}
          path: .cache/mirror-e2e/run.*/artifacts/
          include-hidden-files: true
          retention-days: 7
