apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-state
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
# The pinned vCluster Role plus installation, inventory, and controller rights.
# No bind/escalate bypass: Kubernetes checks each Role/RoleBinding we create.
# TestPinnedChartContractRBAC checks this against both upstream profiles.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-runtime
  namespace: {{ .Values.destinationNamespace | quote }}
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, endpoints, pods, pods/attach, pods/portforward, pods/exec, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/status, pods/ephemeralcontainers, pods/resize]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [clusterreplicas, replicaaccesses]
    verbs: [get, list, watch, update, patch]
  # Cleanup requests access revocation before it removes the guest API.
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicaaccesses]
    verbs: [delete]
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [clusterreplicas/status, replicaaccesses/status, clusterreplicas/finalizers, replicaaccesses/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicaexperiments]
    verbs: [get, list, watch, update, patch, delete]
  {{- if .Values.chaos.enabled }}
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicaexperiments/status, replicaexperiments/finalizers]
    verbs: [get, update, patch]
  {{- end }}
  {{- if or .Values.chaos.enabled .Values.databases.enabled }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  {{- end }}
  {{- if .Values.mirrors.enabled }}
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [clusterreplicas, replicamirrors, replicamirrorruns]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicamirrors/status, replicamirrorruns/status, replicamirrors/finalizers, replicamirrorruns/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-runtime
  namespace: {{ .Values.destinationNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-runtime
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
rules:
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicagrants]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  {{- if .Values.mirrors.enabled }}
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, create, delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  {{- end }}
  {{- if and .Values.databases.enabled (not .Values.mirrors.enabled) }}
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  {{- end }}
  {{- with .Values.clusterReadRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- range .Values.sources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
  namespace: {{ .namespace | quote }}
rules:
  {{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
  namespace: {{ .namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name | quote }}
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}
