apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-state
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-state
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
# vCluster needs to manage workloads and RBAC inside this explicitly delegated lab.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-runtime
  namespace: {{ .Values.destinationNamespace }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Name }}-runtime
  namespace: {{ .Values.destinationNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-runtime
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
rules:
  - apiGroups: [replica.nimeshbuilds.dev]
    resources: [replicagrants]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  {{- with .Values.clusterReadRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.sources }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
  namespace: {{ .namespace }}
rules:
  {{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Namespace }}-{{ $.Release.Name }}-source
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
