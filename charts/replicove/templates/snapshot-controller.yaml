{{- if .Values.mirrors.enabled }}
{{- $mode := .Values.mirrors.snapshotController.mode }}
{{- if not (has $mode (list "auto" "managed" "existing")) }}
{{- fail "mirrors.snapshotController.mode must be auto, managed, or existing" }}
{{- end }}
{{- $name := printf "%s-snapshot-controller" .Release.Name }}
{{- $existing := lookup "apps/v1" "Deployment" .Release.Namespace $name }}
{{- $snapshots := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "volumesnapshots.snapshot.storage.k8s.io" }}
{{- $ownedAPI := and $snapshots (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $snapshots) .Release.Name) (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $snapshots) .Release.Namespace) }}
{{- $managed := or (eq $mode "managed") (and (eq $mode "auto") (or $existing $ownedAPI (not $snapshots))) }}
{{- if $managed }}
{{- range $path, $_ := .Files.Glob "files/snapshot-crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $live := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $crd.metadata.name }}
{{- $ours := and $live (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $live) $.Release.Name) (eq (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $live) $.Release.Namespace) }}
{{- if or (not $live) $ours }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") (default dict $crd.metadata.annotations)) }}
{{- $_ := set $crd.metadata "labels" (merge (dict "replicove.nimeshbuilds.dev/infrastructure" "true") (default dict $crd.metadata.labels)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents, volumesnapshots]
    verbs: [create, get, list, watch, update, delete, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents/status, volumesnapshots/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    replicove.nimeshbuilds.dev/infrastructure: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        replicove.nimeshbuilds.dev/infrastructure: "true"
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snapshot-controller
          image: {{ .Values.mirrors.snapshotController.image | quote }}
          args:
            - --leader-election=true
            - --leader-election-namespace={{ .Release.Namespace }}
            - --feature-gates=CSIVolumeGroupSnapshot=false
            - --http-endpoint=:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz/leader-election
              port: 8080
{{- end }}
{{- end }}
