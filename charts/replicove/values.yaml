# Install into an administrator-only namespace, separate from destinationNamespace.
image:
  repository: ghcr.io/nimeshbuilds/replicove
  tag: "0.2.0-alpha.2"
  # When set, digest takes precedence over tag (sha256: followed by 64 hex digits).
  digest: ""
  pullPolicy: IfNotPresent
destinationNamespace: replica-lab
# Create if absent; reuse an existing namespace without taking ownership.
# A namespace created by this chart is retained on uninstall.
createDestinationNamespace: true
# Native YAML uses a one-shot Job so no encryption key is committed to Git.
# Helm installations retain their existing generated Secret by default.
stateKey:
  bootstrap: false
# Source RBAC is explicit; ReplicaGrant narrows which reads each request may use.
sources: []
# Example source:
# - namespace: source-dev
#   rules:
#   - apiGroups: ["", "apps", "batch"]
#     resources: ["configmaps", "secrets", "serviceaccounts", "services", "deployments", "statefulsets", "jobs"]
#     verbs: ["get", "list"]
# Optional read-only cluster resources, such as CRDs and ClusterRoles.
clusterReadRules: []
# Optional host-to-guest CSI data mirrors. All Replicove controllers remain in
# this deployment. CSI drivers stay under the host administrator's management.
mirrors:
  enabled: false
  # Set after validating that the host CNI enforces NetworkPolicy egress rules.
  networkPolicyEnforced: false
  # Namespaces where the operator may create/delete its own capture snapshots.
  # Workload/Secret reads still use sources above plus ReplicaGrant.
  sources: []
  snapshotController:
    # auto installs the bundled controller/APIs only when absent; existing reuses
    # host infrastructure; managed explicitly installs our controller.
    mode: auto
    image: registry.k8s.io/sig-storage/snapshot-controller:v8.6.0
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
