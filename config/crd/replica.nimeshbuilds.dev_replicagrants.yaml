                      type: string
                    kubeconfigSecret:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    mirrorReleaseName:
                      description: |-
                        Optional administrator-qualified vCluster 0.37.1 single-namespace runtime
                        in the destination namespace. Required for CSI mirrors into an existing target.
                      type: string
                    name:
                      type: string
                  required:
                  - clusterUID
                  - kubeconfigSecret
                  - name
                  type: object
                type: array
              helmReleases:
                description: Helm release storage contains sensitive values and embedded
                  templates.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              maxAccessSeconds:
                default: 900
                format: int64
                maximum: 3600
                minimum: 600
                type: integer
              maxCaptureBytes:
                default: 524288
                format: int32
                maximum: 716800
                minimum: 1024
                type: integer
              maxConcurrentReplicas:
                description: |-
                  Maximum admitted replicas using this grant. Zero leaves only runtime capacity limits.
                  Queued requests retain their original TTL. Host resource limits are enforced by ResourceQuota.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              maxObjects:
                default: 500
                format: int32
                maximum: 2000
                minimum: 1
                type: integer
              maxTTL:
                default: 24h
                type: string
              mirror:
                description: Explicit permission to read volume data. Empty-volume
                  permission alone is insufficient.
                properties:
                  allowForcedReset:
                    type: boolean
                  maxRevisions:
                    default: 2
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  minInterval:
                    default: 1h
                    type: string
                  volumes:
                    items:
                      description: |-
                        MirrorVolumeGrant delegates capture of one PVC and the exact storage classes.
                        It never delegates arbitrary backend handles or direct source volume mounts.
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        snapshotClass:
                          type: string
                        storageClass:
                          type: string
                      required:
                      - name
                      - namespace
                      - snapshotClass
                      - storageClass
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                required:
                - volumes
                type: object
              platform:
                properties:
                  namespace:
                    type: string
                  project:
                    type: string
                  template:
                    type: string
                  templateVersion:
