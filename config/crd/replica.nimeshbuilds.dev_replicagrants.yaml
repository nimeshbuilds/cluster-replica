---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: replicagrants.replica.nimeshbuilds.dev
spec:
  group: replica.nimeshbuilds.dev
  names:
    kind: ReplicaGrant
    listKind: ReplicaGrantList
    plural: replicagrants
    singular: replicagrant
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReplicaGrant is administered at cluster scope. Destination users must not
          receive write access to grants or to the operator's protected state namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              accessRoles:
                items:
                  type: string
                type: array
              accessSubjects:
                description: Optional exact-Secret RBAC recipients for every access
                  session under this grant.
                items:
                  description: |-
                    AccessSubject is an administrator-approved reader of session credentials.
                    It does not infer who originally created a request in the shared namespace.
                  properties:
                    kind:
                      enum:
                      - User
                      - Group
                      - ServiceAccount
                      type: string
                    name:
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 32
                type: array
              allowEmptyVolumes:
                type: boolean
              chaos:
                description: |-
                  ChaosGrant is an explicit administrator delegation for guest-only faults.
                  It grants no host, node, privileged-container, or cloud API access.
                properties:
                  images:
                    description: Exact immutable image references (name@sha256:digest),
                      including stress images.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  kinds:
                    items:
                      type: string
                    maxItems: 6
                    minItems: 1
                    type: array
                  maxCPUMilli:
                    default: 500
                    description: Total across all stress and custom Jobs in an experiment.
                    format: int64
                    maximum: 2000
                    minimum: 1
                    type: integer
                  maxDurationSeconds:
                    default: 60
                    format: int64
                    maximum: 900
                    minimum: 1
                    type: integer
                  maxMemoryMiB:
                    default: 128
                    format: int64
                    maximum: 1024
                    minimum: 16
                    type: integer
                  namespaces:
