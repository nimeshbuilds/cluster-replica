                items:
                  properties:
                    group:
                      description: Empty group means the core API. Wildcards must
                        be explicitly granted.
                      type: string
                    kind:
                      type: string
                  required:
                  - group
                  - kind
                  type: object
                type: array
              secrets:
                description: Explicitly selected credential names. '*' is an administrator
                  opt-in.
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              sourceNamespaces:
                items:
                  type: string
                maxItems: 32
                minItems: 1
                type: array
              targetNamespace:
                type: string
            required:
            - resources
            - sourceNamespaces
            - targetNamespace
            type: object
