# Replace the image with one you build and push. No official image exists yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-replica
  namespace: replica-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-replica
    spec:
      serviceAccountName: cluster-replica
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: YOUR_REGISTRY/cluster-replica:dev
          args: ["--watch-namespace=replica-lab"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
