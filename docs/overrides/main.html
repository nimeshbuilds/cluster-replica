{% extends "base.html" %}
{% block extrahead %}
{% if page %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Replicove">
<meta property="og:title" content="{{ page.title | e }} · Replicove">
<meta property="og:description" content="{{ (page.meta.description or config.site_description) | e }}">
<meta property="og:url" content="{{ page.canonical_url }}">
<meta property="og:image" content="{{ config.site_url }}assets/brand/replicove-social.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | e }} · Replicove">
<meta name="twitter:description" content="{{ (page.meta.description or config.site_description) | e }}">
<meta name="twitter:image" content="{{ config.site_url }}assets/brand/replicove-social.png">
{% endif %}
{% endblock %}
