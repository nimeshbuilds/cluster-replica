# Source workload reads and data capture require the matching ReplicaGrant.
mirrors:
  enabled: true
  networkPolicyEnforced: true
  sources: [source-dev]
sources:
  - namespace: source-dev
    rules:
      - apiGroups: [""]
        resources: [configmaps, persistentvolumeclaims, services]
        verbs: [get, list]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list]
