apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: replicove-source-reader
  namespace: source-dev
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, serviceaccounts, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: replicove-source-reader
  namespace: source-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: replicove-source-reader
subjects:
  - kind: ServiceAccount
    name: replicove
    namespace: replicove-system
