# Keep non-default settings through a later mirror-only values overlay.
mirrors:
  enabled: false
resources:
  requests:
    cpu: 125m
    memory: 256Mi
  limits:
    memory: 768Mi
sources:
  - namespace: source-dev
    rules:
      - apiGroups: [""]
        resources: [configmaps, persistentvolumeclaims, services]
        verbs: [get, list]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list]
